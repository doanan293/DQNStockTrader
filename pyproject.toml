[project]
name = "dqn-stock-trader"
version = "0.1.0"
description = "Deep Q-learning stock trading agents for the Vietnamese market, with honest baselines"
readme = "README.md"
license = "MIT"
authors = [{ name = "Doan Van An", email = "andoan020903@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
    "torch>=2.3",
    "typer>=0.12",
    "typing-extensions>=4.16.0",
]

[project.scripts]
dqn-trader = "dqn_stock_trader.cli:app"

[dependency-groups]
dev = ["pandas-stubs", "pre-commit", "pyrefly", "pytest", "ruff", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "N", "C4", "PERF", "RET", "TRY",
    "ARG", "ERA", "S", "T20", "DTZ", "BLE", "FBT", "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT", "PLC0415"]
"src/dqn_stock_trader/cli.py" = ["T20", "FBT001", "FBT002", "PLR0913", "PLR0917"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-interpreter-path = ".venv/bin/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long-running experiments, skipped in CI"]
